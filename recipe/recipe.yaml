context:
  name: "fitsio"
  version: "1.4.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/esheldon/fitsio.git
  branch: windows-ci
  # url: https://github.com/esheldon/fitsio/archive/refs/tags/${{ version }}.tar.gz
  # sha256: 7ece7c8234058b5a2c97f7b1259ff396f2d1e91e1cb263ceebd16dde63ab1b9f

build:
  number: 1

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: unix
      then:
        - libtool
        - make
      else:
        - cmake <4
        - ninja
        - ${{ compiler("cxx") }}  # CMake needs this, but CFITSIO itself does not
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - numpy
    - if: unix
      then: bzip2
    - libcurl
    - zlib
  run:
    - python
    - setuptools  # the test modules now use pkg_resources

  # zlib is bundled, but is needed for configure / cmake
  # we put it in host to make configure / cmake happy
  ignore_run_exports:
    from_package:
      - zlib
      - if: win
        then: ${{ compiler("cxx") }}  # CMake needs this, but CFITSIO itself does not          

tests:
  - script:
      - pytest --pyargs fitsio.tests
      - if: unix
        then:
          - python -c "import fitsio; assert fitsio.cfitsio_has_bzip2_support()"
        else:
          - python -c "import fitsio; assert not fitsio.cfitsio_has_bzip2_support()"
      - python -c "import fitsio; assert fitsio.cfitsio_has_curl_support()"
    requirements:
      run:
        - pytest
        - pytest-run-parallel
        - pytest-skip-slow
  - python:
      imports:
        - fitsio

about:
  homepage: https://github.com/esheldon/fitsio
  license: GPL-2.0-only AND Zlib
  license_file:
    - LICENSE.txt
    - LICENSE_cfitsio.txt
    - LICENSE_zlib.txt
  summary: A python library to read from and write to FITS files.
  description: |
    This is a python extension written in c and python. Data are read into
    numerical python arrays. A version of cfitsio is bundled with this package,
    there is no need to install your own, nor will this conflict with a
    version you have installed.

extra:
  recipe-maintainers:
    - beckermr
